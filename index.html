<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakerz Bite</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet"
        integrity="sha256-V6lu+OdYNKTKTsVFBuQsyIlDiRWiOmtC8VQ8Lzdm2i4=" crossorigin="anonymous">
</head>

<body>
    <header>
        <nav>
            <!-- For logo -->
            <div id="logo"></div>
            <!-- For navigation links -->
            <div id="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </div>
            <!-- For search bar and icon -->
            <div id="icons">
                <!-- Cart Image ko icon-img class di -->
                <img src="./images/cart-shopping-solid-full.svg" alt="Add to cart Icon" class="icon-img">
            </div>
        </nav>
    </header>

    <!-- main section for Hero image and text -->

    <main>
        <!-- Hero section -->
        <!-- Hero Carousel Section -->
        <section>
            <div id="hero">
                <div id="carouselExampleFade" class="carousel slide carousel-fade" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <!-- 1st Image -->
                        <div class="carousel-item active">
                            <img class="d-block w-100 hero-img" src="./images/Croissants.png" alt="Croissant" />
                        </div>
                        <!-- 2nd Image -->
                        <div class="carousel-item">
                            <img class="d-block w-100 hero-img" src="./images/Croissants.png" alt="Croissants" />
                        </div>
                        <!-- 3rd Image -->
                        <div class="carousel-item">
                            <img class="d-block w-100 hero-img" src="./images/Croissants.png" alt="Cupcake" />
                        </div>
                    </div>
                    <!-- Carousel Controls -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </section>
        <!-- Hero section -->

    </main>


    <footer>
        <div id="location">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3619.902486747968!2d67.0216660744932!3d24.8671798449903!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb33e6b1566c46f%3A0x65318f4eb62c7aa8!2sAptech%20Learning%20Garden%20Center!5e0!3m2!1sen!2s!4v1790771296367!5m2!1sen!2s"
                width="449.594" height="224.797" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

</html>
