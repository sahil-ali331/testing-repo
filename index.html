<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakerz Bite</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./assets/css/bootstrap.css">
    <script src="./assets/js/bootstrap.js" defer></script>
</head>

<body>

    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg custom-navbar py-2">
            <div class="container">

                <a class="navbar-brand d-flex align-items-center" href="#">
                    <div id="logo-container" class="me-2">
                        <img src="./assets/images/logo.png" alt="Bakerz Bite Logo" class="logo-img"
                            onerror="this.style.display='none'">
                        <span class="logo-fallback-text">BB</span>
                    </div>
                    <span class="brand-title fw-bold fs-4">Bakerz Bite</span>
                </a>

                <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav mx-auto mb-3 mb-lg-0 py-2 py-lg-0" id="nav-links">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>

                    <div id="icons" class="d-flex align-items-center justify-content-center">
                        <a href="#" class="cart-btn d-flex align-items-center text-decoration-none">
                            <img src="./assets/images/cart-shopping-solid-full.svg" alt="Cart Icon"
                                class="icon-img me-2">
                            <span class="fw-bold">Cart</span>
                        </a>
                    </div>
                </div>

            </div>
        </nav>
    </header>

    <main>
        <section id="hero">
            <div id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="3000">
                        <img class="d-block w-100 hero-img" src="./assets/images/Arch Shae (2).png" alt="Croissant" />
                    </div>
                    <div class="carousel-item" data-bs-interval="3000">
                        <img class="d-block w-100 hero-img" src="./assets/images/Croissants.png" alt="Croissants" />
                    </div>
                    <div class="carousel-item" data-bs-interval="3000">
                        <img class="d-block w-100 hero-img" src="./assets/images/Croissants.png" alt="Cupcake" />
                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="py-4">
        <div class="container">
            <div class="row g-4 align-items-center">
                <div class="col-md-6">
                    <div class="ratio ratio-16x9 rounded overflow-hidden">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3619.902486747968!2d67.0216660744932!3d24.8671798449903!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb33e6b1566c46f%3A0x65318f4eb62c7aa8!2sAptech%20Learning%20Garden%20Center!5e0!3m2!1sen!2s!4v1790771296367!5m2!1sen!2s"
                            style="border:0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="strict-origin-when-cross-origin">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
