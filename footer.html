<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer Demo</title>
  
<style>
  body {
  margin: 0;
  padding-bottom: 48px;
  font-family: "Times New Roman", Times, serif;
}

.container {
  width: min(1200px, 92%);
  margin: 0 auto;
}

.site-footer {
  padding: 32px 0;
  background:#432818;
  border-top: 2px solid #FFE6A7;
  color: #ffffff;
}

.footer-content {
  display: grid;
  grid-template-columns:
    minmax(190px, 1fr)
    minmax(160px, 0.8fr)
    minmax(220px, 1fr);
  align-items: start;
  gap: 26px 36px;
}

.footer-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #ffffff;
  font-size: 18px;
  font-weight: bold;
  text-decoration: none;
}

.footer-brand img {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  object-fit: cover;
}

.footer-description {
  margin: 14px 0 0;
  color: #FFE6A7;
  line-height: 1.5;
}

.footer-links-group h2,
.sitemap-block h2 {
  margin: 4px 0 14px;
  color: white;
  font-size: 15px;
}

.footer-navigation-links,
.sitemap-links {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 16px;
}

.footer-navigation-links a,
.sitemap-links a {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  color: #FFE6A7;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
  text-decoration: none;
}

.footer-navigation-links a::before,
.sitemap-links a::before {
  content: "•";
  flex: 0 0 auto;
  color:#FFE6A7;
  font-size: 16px;
  line-height: 1;
}

.footer-navigation-links a:hover,
.sitemap-links a:hover {
  color: #ffffff;
  text-decoration: underline;
}

.site-footer .footer-content > small {
  grid-column: 1 / -1;
  padding-top: 16px;
  border-top: 1px solid #ffffff2a;
  color: #c0d6d9;
}

@media (max-width: 900px) {
  .footer-content {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .footer-brand-group {
    grid-column: 1 / -1;
  }
}

@media (max-width: 600px) {
  body {
    padding-bottom: 56px;
  }

  .footer-content {
    grid-template-columns: minmax(0, 1fr);
    gap: 20px;
  }

  .footer-brand-group {
    grid-column: auto;
  }

  .footer-navigation-links,
  .sitemap-links {
    gap: 10px 12px;
  }

  .footer-navigation-links a,
  .sitemap-links a {
    font-size: 12px;
    line-height: 1.45;
  }

  .site-footer .footer-content > small {
    grid-column: auto;
  }

  
}

@media (max-width: 360px) {
  .container {
    width: calc(100% - 24px);
  }

  .footer-navigation-links,
  .sitemap-links {
    grid-template-columns: 1fr;
  }

  
}

</style>

</head>
<body>

  

  <footer class="site-footer">
    <div class="container footer-content">

      <div class="footer-brand-group">
        <a href="#" class="footer-brand">
          <img src="" >
          
        </a>
        <p class="footer-description">
          Discover beautiful destinations, travel guides and useful information.
        </p>
      </div>

      <div class="footer-links-group">
        <h2>Quick Links</h2>
        <nav class="footer-navigation-links" aria-label="Footer navigation">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#beaches">Beaches</a>
          <a href="#gallery">Gallery</a>
          <a href="#travel">Travel</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>

      <div class="sitemap-block">
        <h2>Sitemap</h2>
        <nav class="sitemap-links" aria-label="Sitemap">
          <a href="#home">Home</a>
          <a href="#destinations">Destinations</a>
          <a href="#guidelines">Guidelines</a>
          <a href="#gallery">Photo Gallery</a>
          <a href="#travel">Travel Guide</a>
          <a href="#contact">Contact Us</a>
        </nav>
      </div>

      <small>
        &copy; <span id="footerYear"></span>2026 Baker’s Bites. All rights reserved.
      </small>

    </div>
  </footer>

  
</body>
</html>
